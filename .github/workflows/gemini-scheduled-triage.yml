name: Gemini Scheduled Issue Triage

on:
  workflow_dispatch:

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-scheduled-triage.yml@d115dc66228388ae8a1079a5324cfbdd2c759643
    with:
      repo_write_auth: github_token
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
