name: Gemini Scheduled Issue Triage

on:
  workflow_dispatch:

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-scheduled-triage.yml@1b98172325533ef6ad37f3d2cfc3870073fac26d
    with:
      repo_write_auth: github_token
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
