name: ShellCheck

on:
  push:
    branches: [master]
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [master]
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled'
        type: boolean
        default: false

jobs:
  shellcheck:
    name: ShellCheck Analysis
    if: ${{ github.event.inputs.force_run == 'true' || vars.SHELLCHECK_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          set -euo pipefail

          # 추적 중인 셸 스크립트를 대상으로 삼는다. 목록을 하드코딩하면 파일이
          # 늘어도 검사에 들어오지 않고, 그 사실이 초록불에 가려진다.
          mapfile -t files < <(git ls-files '*.sh')

          if [ ${#files[@]} -eq 0 ]; then
            echo "검사할 .sh 파일이 없다" >&2
            exit 1
          fi

          echo "Checking ${#files[@]} files..."
          printf '  %s\n' "${files[@]}"
          shellcheck -x -s bash -S error -f gcc "${files[@]}"

      - name: Summary
        if: always()
        run: |
          echo "## ShellCheck Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ShellCheck analysis completed." >> $GITHUB_STEP_SUMMARY
