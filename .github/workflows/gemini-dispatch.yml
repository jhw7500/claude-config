name: Gemini Dispatch
run-name: jhw-review-comment-${{ github.event.comment.id || github.run_id }}

on:
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-dispatch.yml@d115dc66228388ae8a1079a5324cfbdd2c759643
    with:
      repo_write_auth: github_token
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
